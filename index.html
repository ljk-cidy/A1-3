<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 웹 서비스</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 1. 메인 Hero 섹션 -->
    <header class="hero-section">
        <div class="container">
            <h1>나만의 AI 추천 서비스</h1>
            <p>궁금한 것을 입력하면 AI가 빠르고 정확하게 추천해 드립니다.</p>
        </div>
    </header>

    <!-- 2. AI 입력/결과 섹션 -->
    <section class="ai-section container">
        <h2>AI에게 물어보세요</h2>
        <div class="ai-input-wrapper">
            <input type="text" id="ai-input" placeholder="예: 오늘 저녁 메뉴 추천해 줘">
            <button id="ai-btn">추천받기</button>
        </div>
        
        <!-- 결과창 카드 -->
        <div class="result-card" id="result-card">
            <!-- 로딩 스피너 (초기에는 숨김) -->
            <div id="loading-spinner" class="hidden"></div>
            <p id="result-text">이곳에 AI의 추천 결과가 표시됩니다.</p>
        </div>
    </section>

    <!-- 3. FAQ 섹션 -->
    <section class="faq-section container">
        <h2>자주 묻는 질문 (FAQ)</h2>
        <div class="faq-item">
            <h3>Q. 무료로 이용할 수 있나요?</h3>
            <p>A. 네, 누구나 무료로 이용할 수 있습니다.</p>
        </div>
        <div class="faq-item">
            <h3>Q. 결과가 나오는데 얼마나 걸리나요?</h3>
            <p>A. 보통 3~5초 이내에 AI가 답변을 생성합니다.</p>
        </div>
    </section>

    <!-- 자바스크립트 연결 -->
    <script src="./main.js"></script>
</body>
</html>
