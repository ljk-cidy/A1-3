<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 AI 추천 서비스</title>
    <!-- CSS 경로: css/style.css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-section">
        <div class="container">
            <h1>나만의 AI 추천 서비스</h1>
            <p>궁금한 것을 입력하면 AI가 빠르고 정확하게 추천해 드립니다.</p>
        </div>
    </header>

    <section class="ai-section container">
        <h2>AI에게 물어보세요</h2>
        <div class="ai-input-wrapper">
            <input type="text" id="ai-input" placeholder="예: 오늘 저녁 메뉴 추천해 줘">
            <button id="ai-btn">추천받기</button>
        </div>
        
        <div class="result-card" id="result-card">
            <div id="loading-spinner" class="hidden"></div>
            <p id="result-text">이곳에 AI의 추천 결과가 표시됩니다.</p>
        </div>
    </section>

    <section class="faq-section container">
        <h2>자주 묻는 질문 (FAQ)</h2>
        <div class="faq-item">
            <h3>Q. 무료로 이용할 수 있나요?</h3>
            <p>A. 네, 누구나 무료로 이용할 수 있습니다.</p>
        </div>
        <div class="faq-item">
            <h3>Q. 결과가 나오는데 얼마나 걸리나요?</h3>
            <p>A. 보통 3~5초 이내에 AI가 답변을 생성합니다.</p>
        </div>
    </section>

    <!-- JS 경로: js/main.js -->
    <script src="js/main.js"></script>
</body>
</html>
