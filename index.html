<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 AI 추천 서비스</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍳%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-section" id="home">
        <div class="container">
            <h1>나만의 AI 추천 서비스</h1>
            <p>냉장고 속 남은 재료를 입력하면 AI가 만들 수 있는 간단 요리를 추천해 드립니다.</p>
            <a href="#ai-section" class="start-btn">시작하기</a>
        </div>
    </header>

    <section class="ai-section container" id="ai-section">
        <h2>냉장고 속 재료를 알려주세요</h2>
        <div class="ai-input-wrapper">
            <input type="text" id="ai-input" maxlength="100" placeholder="예: 계란, 대파, 밥">
            <button id="ai-btn">추천받기</button>
        </div>
        <p class="hint">재료를 쉼표(,)로 구분해 입력하세요. (100자 이내)</p>

        <div class="result-card" id="result-card">
            <div id="loading-spinner" class="hidden"></div>
            <p id="result-text">이곳에 AI의 추천 결과가 표시됩니다.</p>
        </div>
    </section>

    <section class="faq-section container" id="faq">
        <h2>자주 묻는 질문 (FAQ)</h2>
        <div class="faq-item">
            <h3>Q. 무료로 이용할 수 있나요?</h3>
            <p>A. 네, 누구나 무료로 이용할 수 있습니다.</p>
        </div>
        <div class="faq-item">
            <h3>Q. 결과가 나오는데 얼마나 걸리나요?</h3>
            <p>A. 보통 3~5초 이내에 AI가 답변을 생성합니다.</p>
        </div>
    </section>

    <section class="contact-section container" id="contact">
        <h2>문의 안내</h2>
        <div class="faq-item">
            <p>오류나 개선 의견은 <a href="https://github.com/ljk-cidy/A1-3/issues" target="_blank" rel="noopener">GitHub Issues</a>에 남겨 주세요.</p>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
